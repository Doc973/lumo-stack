name: Build voice_capture Docker image

on:
  push:
    paths:
      - 'voice_capture/**'      # trigger solo se cambiano file in voice_capture
  workflow_dispatch:           # permette di avviare manualmente

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout del repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Docker Buildx (supporta build multi‑arch)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3️⃣ (Opzionale) Login a Docker Hub – abilita solo se vuoi pushare l’immagine lì
      #    Crea i secret DOCKERHUB_USERNAME e DOCKERHUB_TOKEN nelle impostazioni del repo.
      #- name: Log in to Docker Hub
      #  uses: docker/login-action@v3
      #  with:
      #    username: ${{ secrets.DOCKERHUB_USERNAME }}
      #    password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4️⃣ Build dell’immagine usando il compose del progetto
      - name: Build voice_capture image
        run: |
          docker compose -f docker-compose.yml build --no-cache voice_capture

      # 5️⃣ (Opzionale) Push su Docker Hub
      #- name: Tag and push image
      #  run: |
      #    docker tag voice_capture:latest ${{ secrets.DOCKERHUB_USERNAME }}/voice_capture:latest
      #    docker push ${{ secrets.DOCKERHUB_USERNAME }}/voice_capture:latest

      # 6️⃣ Salva l’immagine come artifact (downloadabile)
      - name: Save image as tar
        run: |
          docker save voice_capture:latest -o voice_capture.tar
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice_capture-image
          path: voice_capture.tar
