events {}

http {
    # Log di base (puoi personalizzarli più avanti)
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ----------- Whisper -----------
    upstream whisper_srv {
        server whisper:8000;   # nome del servizio definito in docker‑compose
    }

    location /whisper/ {
        proxy_pass http://whisper_srv/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------- Vosk ---------------
    upstream vosk_srv {
        server vosk:8000;
    }

    location /vosk/ {
        proxy_pass http://vosk_srv/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------- TTS ----------------
    upstream tts_srv {
        server tts:8000;
    }

    location /tts/ {
        proxy_pass http://tts_srv/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
